# Logisim 2.7.1 single-cycle MIPS adapter. Paths are relative to the main circuit.
main=main
pc.base=0x3000
im.words=4096
dm.bytes=0x3000
reset.pin=rst
reset.active=1
clock.mode=builtin
clock.selector=Clock
clock.pin=__autotest_clock
im.path=IFU
im.selector=ROM
pin.Instr=Instr
pin.pc=pc
pin.RegWrite=RegWrite
pin.RegAddr=RegAddr
pin.RegData=RegData
pin.MemWrite=MemWrite
pin.MemAddr=MemAddr
pin.MemData=MemData
appearance.verify=true
# Optional implementation-specific snapshots. Disable for other GRF/DM structures.
snapshot.registers=true
grf.path=GRF
grf.labelPattern=%d
snapshot.memory=true
dm.path=DM
dm.selector=RAM
